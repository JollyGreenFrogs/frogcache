# frogcache — self-hosted LAN artifact cache with weekly auto-update + pull-through.
#
#   cache    nginx autoindex over the files share  -> http://<cache-host>:8091/
#            (404s proxy to the fetcher for pull-through auto-add, ADR-003 §A)
#   updater  weekly checks upstream per artifact; downloads go to the air-gapped
#            sandbox volume FIRST, are verified (digest+ClamAV+format), then
#            promoted to the files share (ADR-003 §D); retains latest+latest-1.
#   fetcher  pull-through server on loopback:8092 (ADR-003 §A); appends auto specs
#            to artifacts.json so the weekly loop manages them from then on.
#
# STORAGE (ADR-003 §C): all real data lives on real shares on the LAN data server
# (DATA_SHARE, SMB/NFS mounted on the docker host), bind-mounted below — backed
# up and redundant. The ONLY named volume is frogcache-sandbox: the air-gapped
# staging area for unverified downloads, mounted into updater+fetcher only.
#
# NO-SSH RULE: deploy/operate ONLY via `docker --context <name> ...` (deploy.sh).
#
# Governing ADRs: docs/decisions/ADR-001/002/003/004 (in this repo).
services:
  cache:
    image: nginx:alpine
    container_name: frogcache
    restart: unless-stopped
    network_mode: host          # serves on the host LAN IP: http://<cache-host>:8091/
    volumes:
      - ${DATA_SHARE:-/mnt/frogcache}/files:/usr/share/nginx/html:ro
    command: >
      sh -c "printf 'server { listen 8091; root /usr/share/nginx/html; autoindex on;
              error_page 404 = @fetch; location @fetch { proxy_pass http://127.0.0.1:8092; proxy_read_timeout 900s; proxy_send_timeout 900s; } }' > /etc/nginx/conf.d/default.conf
              && nginx -g 'daemon off;'"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8091/"]
      interval: 30s
      timeout: 3s
      retries: 3

  updater:
    image: ${UPDATER_IMAGE:?set UPDATER_IMAGE to your registry image, e.g. <registry>/frogcache/updater:latest}
    container_name: frogcache-updater
    restart: unless-stopped
    depends_on:
      cache:
        condition: service_healthy
    volumes:
      - ${DATA_SHARE:-/mnt/frogcache}/files:/cache
      - ${DATA_SHARE:-/mnt/frogcache}/artifacts:/artifacts
      - ${DATA_SHARE:-/mnt/frogcache}/data:/data
      - ${DATA_SHARE:-/mnt/frogcache}/secrets:/run/secrets:ro
      - frogcache-sandbox:/sandbox
    environment:
      CACHE_DIR: /cache
      ARTIFACTS_FILE: /artifacts/artifacts.json
      STATE_FILE: /data/manifest.json   # legacy manifest, imported once into Postgres
      SECRETS_FILE: /run/secrets/frogcache.env
      SANDBOX_DIR: /sandbox
      QUARANTINE_DIR: /sandbox/quarantine
      CHECK_INTERVAL_SECONDS: "604800"   # weekly
      RETAIN: "2"                        # latest + latest-1
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  fetcher:
    image: ${UPDATER_IMAGE:?set UPDATER_IMAGE to your registry image, e.g. <registry>/frogcache/updater:latest}
    container_name: frogcache-fetcher
    restart: unless-stopped
    network_mode: host                  # nginx proxies 404s to 127.0.0.1:8092
    command: ["sh", "-c", "(while true; do freshclam --quiet || true; sleep 86400; done) & exec python -m frogcache --fetch-server"]
    volumes:
      - ${DATA_SHARE:-/mnt/frogcache}/files:/cache
      - ${DATA_SHARE:-/mnt/frogcache}/artifacts:/artifacts
      - ${DATA_SHARE:-/mnt/frogcache}/data:/data
      - ${DATA_SHARE:-/mnt/frogcache}/secrets:/run/secrets:ro
      - frogcache-sandbox:/sandbox
    environment:
      CACHE_DIR: /cache
      ARTIFACTS_FILE: /artifacts/artifacts.json
      STATE_FILE: /data/manifest.json   # legacy manifest, imported once into Postgres
      SECRETS_FILE: /run/secrets/frogcache.env
      SANDBOX_DIR: /sandbox
      QUARANTINE_DIR: /sandbox/quarantine
      HTTP_TIMEOUT: "120"

volumes:
  frogcache-sandbox:   # air-gapped staging only — never on the data share, never backed up
