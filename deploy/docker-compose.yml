# frogcache — self-hosted LAN artifact cache with weekly auto-update.
#
#   cache    nginx autoindex over the frogcache-files volume  -> http://<redacted-ip>:8091/
#   updater  frogcache image (built by Woodpecker, pushed to <redacted-ip>:5005):
#            weekly checks upstream per seed artifact, downloads newer versions
#            into frogcache-files, retains latest + latest-1 (RETAIN=2), ntfy notify.
#
# PORT NOTE: 8090 is taken by <redacted-host>'s ntfy container, hence 8091.
#
# NO-SSH RULE: deploy/operate ONLY via `docker --context <redacted-host> ...` (deploy.sh).
# No host bind paths — everything lives in named volumes.
#
# Governing ADR: docs/decisions/ADR-001-frogcache.md (in this repo).
services:
  cache:
    image: nginx:alpine
    container_name: frogcache
    restart: unless-stopped
    network_mode: host          # serves on <redacted-host>'s LAN IP: http://<redacted-ip>:8091/
    volumes:
      - frogcache-files:/usr/share/nginx/html:ro
    command: >
      sh -c "printf 'server { listen 8091; root /usr/share/nginx/html; autoindex on; }' > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8091/"]
      interval: 30s
      timeout: 3s
      retries: 3

  updater:
    image: ${UPDATER_IMAGE:-<redacted-ip>:5005/frogcache/updater:latest}
    container_name: frogcache-updater
    restart: unless-stopped
    depends_on:
      cache:
        condition: service_healthy
    volumes:
      - frogcache-files:/cache
      - frogcache-artifacts:/artifacts:ro
      - frogcache-data:/data
      - frogcache-secrets:/run/secrets:ro
    environment:
      CACHE_DIR: /cache
      ARTIFACTS_FILE: /artifacts/artifacts.json
      STATE_FILE: /data/manifest.json
      SECRETS_FILE: /run/secrets/frogcache.env
      CHECK_INTERVAL_SECONDS: "604800"   # weekly
      RETAIN: "2"                        # latest + latest-1
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  frogcache-files:
  frogcache-artifacts:
  frogcache-data:
  frogcache-secrets:
