# Woodpecker CI for frogcache (house rule: Woodpecker only, no GitHub Actions).
# - every push/PR: byte-compile gate + unit tests
# - push to main: build the updater image and push it to your private registry
#   (secret `docker_registry`), where deploy/ pulls it.
when:
  event: [push, pull_request]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: frogcache
      POSTGRES_PASSWORD: frogcache
      POSTGRES_DB: frogcache_test

steps:
  - name: test
    image: python:3.15-alpine
    commands:
      - pip install --quiet pytest "psycopg[binary]" alembic sqlalchemy
      - python -m compileall -q src tests
      - export DATABASE_URL=postgresql://frogcache:frogcache@postgres:5432/frogcache_test
      - PYTHONPATH=src python -m pytest -q

  - name: docker-build-push
    image: docker:cli
    when:
      event: push
      branch: [main, develop]   # main -> prod image (latest), develop -> UAT image (uat)
    environment:
      REGISTRY: { from_secret: docker_registry }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -t $REGISTRY/frogcache/updater:${CI_COMMIT_SHA:0:8} .
      - docker push $REGISTRY/frogcache/updater:${CI_COMMIT_SHA:0:8}
      - |
        if [ "$CI_COMMIT_BRANCH" = "main" ]; then TAG=latest; else TAG=uat; fi
        docker tag $REGISTRY/frogcache/updater:${CI_COMMIT_SHA:0:8} $REGISTRY/frogcache/updater:$TAG
        docker push $REGISTRY/frogcache/updater:$TAG
