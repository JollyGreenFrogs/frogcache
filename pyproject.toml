[project]
name = "frogcache"
version = "0.1.0"
description = "Self-hosted LAN artifact cache with weekly upstream auto-update and latest+latest-1 retention"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
frogcache = "frogcache.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frogcache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
